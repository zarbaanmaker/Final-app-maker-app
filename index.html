<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GameCraft AI - Studio Engine</title>
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; background-color: #0b0c10; color: #e3e3e3; overflow: hidden; }

    body { display: flex; flex-direction: column; }

    /* 1. Auth Screen */
    #authScreen {
      position: fixed; inset: 0; background: #0b0c10; z-index: 1000;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
    }
    .brand-logo { font-size: 26px; margin-bottom: 4px; color: #ffffff; font-weight: 700; letter-spacing: 0.5px; }
    .brand-credit { font-size: 11px; color: #888888; margin-bottom: 28px; text-transform: uppercase; letter-spacing: 1.5px; text-align: center; line-height: 1.4; }
    
    .auth-card { 
      width: 100%; max-width: 320px; background: #121318; padding: 28px 24px; 
      border-radius: 12px; border: 1px solid #1f2029; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .auth-title { font-size: 14px; font-weight: 600; color: #ffffff; text-align: center; letter-spacing: 0.5px; }
    
    .google-btn-container { width: 100%; display: flex; justify-content: center; }

    .divider { display: flex; align-items: center; width: 100%; color: #44444c; font-size: 11px; margin: 4px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #1f2029; }
    .divider span { padding: 0 8px; }

    .btn-guest { 
      width: 100%; padding: 10px; background: transparent; border: 1px solid #2a2c38; 
      border-radius: 8px; color: #aaaaaa; font-weight: 600; font-size: 12px; cursor: pointer; 
      transition: all 0.2s;
    }
    .btn-guest:active { background: #1f2029; color: #ffffff; }

    /* 2. Main Studio Interface */
    #mainApp { display: none; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }

    /* Header Layout */
    header { 
      height: 54px; min-height: 54px; background: #121318; border-bottom: 1px solid #1f2029; 
      display: flex; align-items: center; justify-content: space-between; padding: 0 16px; 
    }
    
    .header-left { display: flex; flex-direction: column; }
    .studio-title { font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }

    .header-center { font-size: 12px; font-weight: 700; color: #ffffff; letter-spacing: 1px; text-transform: uppercase; }

    .header-right { display: flex; flex-direction: column; align-items: flex-end; }
    .engine-title { font-size: 12px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
    .by-credit { font-size: 9px; color: #888888; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; }

    /* Viewport Frame */
    .viewport { flex: 1; background: #000000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
    
    .empty-state { position: absolute; text-align: center; color: #555566; padding: 20px; }
    .empty-state-text { font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

    /* Output Console */
    .ai-chat-box { height: 75px; min-height: 75px; background: #0d0e12; border-top: 1px solid #1f2029; padding: 10px 14px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 90%; line-height: 1.3; }
    .msg.ai { background: #161820; color: #cccccc; border: 1px solid #222530; align-self: flex-start; }
    .msg.user { background: #ffffff; color: #000000; font-weight: 600; align-self: flex-end; }

    /* Input Control Bar (Clean - No Credits) */
    .bottom-bar { 
      background: #121318; 
      border-top: 1px solid #1f2029; 
      padding: 10px 14px; 
      padding-bottom: max(10px, env(safe-area-inset-bottom)); 
      display: flex; 
      gap: 10px; 
      align-items: center; 
      width: 100%;
    }
    .mic-btn { width: 42px; height: 42px; min-width: 42px; background: #0b0c10; border: 1px solid #2a2c38; color: #ffffff; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
    .mic-btn.recording { background: #ffffff; color: #000000; border-color: #ffffff; }
    .prompt-input { flex: 1; min-width: 0; background: #0b0c10; border: 1px solid #2a2c38; border-radius: 8px; padding: 12px 14px; color: #ffffff; font-size: 13px; outline: none; }
    .prompt-input:focus { border-color: #4a4d60; }
    .send-btn { width: 42px; height: 42px; min-width: 42px; background: #ffffff; border: none; color: #000000; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }

    @media screen and (orientation: landscape) and (max-height: 500px) {
      header { height: 44px; min-height: 44px; }
      .ai-chat-box { height: 50px; min-height: 50px; }
      .bottom-bar { padding: 6px 10px; }
      .mic-btn, .send-btn { height: 36px; min-width: 36px; }
      .prompt-input { padding: 8px 12px; }
    }
  </style>
</head>
<body>

  <!-- 1. Sign-In Screen -->
  <div id="authScreen">
    <div class="brand-logo">GameCraft AI</div>
    <div class="brand-credit">BY ZAR KING<br>(ZARBAAN)</div>
    <div class="auth-card">
      <div class="auth-title">Sign in to Studio</div>
      
      <div class="google-btn-container">
        <div id="g_id_onload"
            data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
            data-callback="handleCredentialResponse"
            data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
            data-type="standard"
            data-shape="rectangular"
            data-theme="filled_black"
            data-text="signin_with"
            data-size="large">
        </div>
      </div>

      <div class="divider"><span>OR</span></div>

      <button class="btn-guest" onclick="enterStudio('Guest')">Continue as Guest</button>
    </div>
  </div>

  <!-- 2. Main Studio Interface -->
  <div id="mainApp">
    <header>
      <div class="header-left">
        <span class="studio-title">Studio Pro</span>
      </div>

      <div class="header-center">
        <span>HTML PRO</span>
      </div>

      <div class="header-right">
        <span class="engine-title">GAME ENGINE PRO</span>
        <span class="by-credit">BY ZAR KING (ZARBAAN)</span>
      </div>
    </header>

    <div class="viewport">
      <div id="emptyState" class="empty-state">
        <div class="empty-state-text">ENTER PROMPT TO COMPILE GAME</div>
      </div>
      <iframe id="gameFrame"></iframe>
    </div>

    <div class="ai-chat-box" id="chatBox">
      <div class="msg ai" id="welcomeMsg">Pipeline Ready. Type or speak game prompt below.</div>
    </div>

    <div class="bottom-bar">
      <button class="mic-btn" id="micBtn" onclick="toggleVoice()">MIC</button>
      <input type="text" class="prompt-input" id="promptInput" placeholder="Describe game prompt...">
      <button class="send-btn" onclick="handleUserMessage()">SEND</button>
    </div>
  </div>

  <script>
    // 🔑 Gemini API Key
    const API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 
    
    let lastGeneratedHtml = "";
    let isRecording = false;
    let recognition;

    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      const userName = responsePayload.name || "Creator";
      enterStudio(userName);
    }

    function parseJwt (token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function enterStudio(name) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      document.getElementById('welcomeMsg').innerText = `Welcome ${name}! Pipeline Ready. Type or speak game prompt below.`;
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      recognition.onresult = (e) => {
        document.getElementById('promptInput').value = e.results[0][0].transcript;
        toggleVoice();
        handleUserMessage();
      };
      recognition.onerror = () => toggleVoice();
    }

    function toggleVoice() {
      const btn = document.getElementById('micBtn');
      if (!isRecording) {
        recognition && recognition.start();
        btn.classList.add('recording');
        isRecording = true;
      } else {
        recognition && recognition.stop();
        btn.classList.remove('recording');
        isRecording = false;
      }
    }

    async function handleUserMessage() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;

      addChatMessage(text, 'user');
      input.value = '';

      const loadingMsg = addChatMessage("Compiling game engine... Please wait.", 'ai');

      const systemInstruction = `You are a professional HTML5 game developer.
      Generate a complete single-file HTML5/CSS/JavaScript mini-game.
      Requirements:
      1. Must work smoothly on mobile touchscreens with touch controls.
      2. Responsive layout for both portrait and landscape modes.
      3. Return ONLY pure code starting with <!DOCTYPE html> and ending with </html> without markdown blocks.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: systemInstruction + "\nRequest: " + text }] }]
          })
        });

        const data = await response.json();
        let rawHtml = data.candidates[0].content.parts[0].text;
        rawHtml = rawHtml.replace(/```html/g, '').replace(/```/g, '').trim();

        lastGeneratedHtml = rawHtml;
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('gameFrame').srcdoc = rawHtml;

        loadingMsg.innerText = "Game loaded in viewport successfully!";

      } catch (err) {
        loadingMsg.innerText = "Error compiling code. Please check API Key.";
        console.error(err);
      }
    }

    function addChatMessage(text, sender) {
      const box = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
      return msg;
    }
  </script>
</body>
  </html>
